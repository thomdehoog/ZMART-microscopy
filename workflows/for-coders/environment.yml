# What the target acquisition notebook needs, and nothing more: Jupyter, the
# Leica driver (it brings the ZMART Controller) and ZMART analysis with its
# workflows. Each at a released version. conda-forge only.
name: zmart-coders
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - git
  - jupyterlab
  - pip:
      - zmart-drivers[leica] @ git+https://github.com/ZMB-UZH/ZMART-drivers@v0.7.0b2
      - zmart-analysis @ git+https://github.com/ZMB-UZH/ZMART-analysis@v0.6.0rc2
