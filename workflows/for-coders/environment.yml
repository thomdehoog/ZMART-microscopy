# What the target acquisition notebook needs, and nothing more: Jupyter, the
# ZMART Controller and the Leica driver (the driver brings the controller), and
# ZMART analysis from its clone in work/ (the notebook uses its workflows).
# conda-forge only.
name: zmart-coders
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - git
  - jupyterlab
  - pip:
      - zmart-drivers[leica] @ git+https://github.com/ZMB-UZH/ZMART-drivers@release-candidate
      - -e ../../work/ZMART-analysis
