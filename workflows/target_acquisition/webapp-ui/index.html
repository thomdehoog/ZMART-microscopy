<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZMART operator page</title>
  <!-- A browser asks for /favicon.ico on its own if a page names no icon, and
       nothing here serves one, so it fails and the failure is reported to the
       page as an error. That is noise in the console during a run and it fails
       the browser tests, which quite reasonably treat any error as a fault. The
       icon is written into the page rather than kept as a file because the whole
       page is built into a single file that Python hands out. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f172a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2338bdf8' stroke-width='3'/%3E%3C/svg%3E">
</head>
<body>

<div class="wrap">
  <div class="screen">
    <!-- ================= left rail ================= -->
    <div class="rail">
      <div class="wf-box">
        <div class="brand">
          <span class="brand-mark">ZMART</span><span class="brand-sub">microscopy</span>
        </div>
        <div class="wf-row">
          <select class="wf-select" id="wf-select" aria-label="Select workflow"></select>
        </div>
      </div>
      <div class="steps" id="steps"></div>
    </div>

    <!-- ================= right stage ================= -->
    <div class="stage">
      <div class="tabs" id="tabs" role="tablist"></div>

      <!-- The panels are the workflow's, not this page's: the framework builds
           one element per panel the running workflow declares, and what goes
           inside each is that workflow's business. A workflow that shows no
           canvas produces no canvas here. -->

      <!-- Focus strategy has no panel of its own: it happens on the canvas, and
           these are its controls. Parked here in the markup and moved into the
           channel beside the canvas while that step is standing, so everything
           in them is built and wired once. -->
      <div id="focus-controls" hidden>
        <div class="side-group">
          <div class="side-group-title">Place focus points</div>
          <div class="side-group-body">
            <!-- The same two ways the step before offers, under the same
                 words — one at a time by hand, or so many to a tileset all at
                 once — and side by side, because either is a whole answer and
                 neither comes before the other. -->
            <div class="fp-ways">
              <div class="fp-way">
                <div class="side-sub">Manual</div>
                <!-- Armed like a drawing tool, and drawn like one: placing
                     points by hand is the same kind of act as drawing a
                     tileset. Nothing on the canvas answers to a press until it
                     is armed. -->
                <div class="fp-hand">
                <!-- The hand's two states, the way the step before names them:
                     picking what is already down, or putting another down. One
                     is always on, so a press on the map is never a question. -->
                <button type="button" class="sf-tool" id="fp-select"
                        title="Select — press a point to choose it, drag to move it">
                  <span class="sf-glyph">↖</span>
                </button>
                <button type="button" class="sf-tool" id="fp-pick"
                        title="Place focus points — press the map to put one down, press one to take it away">
                  <!-- The mark it puts down, drawn at the size a glyph is: the
                       button and the thing it makes say the same thing. Its
                       proportions are the canvas reticle's — a circle of 4.5
                       with arms from 6.5 to 11, at a scale of one to two. -->
                  <svg class="sf-glyph sf-glyph-drawn" viewBox="0 0 22 22" aria-hidden="true">
                    <circle cx="11" cy="11" r="2.25" />
                    <path d="M 5.5 11 L 7.75 11 M 14.25 11 L 16.5 11
                             M 11 5.5 L 11 7.75 M 11 14.25 L 11 16.5" />
                  </svg>
                </button>
                <!-- Beside the hand, because the hand is what fills a map one
                     point at a time and this is the way back out of it. -->
                <button type="button" class="sf-flat" id="fp-clear">Clear focus points</button>
                </div>
              </div>

              <!-- Two automatics, each with its own number, because they are
                   answers to different questions and an operator wants both to
                   hand: so many in every drawn thing, or so many over the whole
                   carrier. One number serving both meant choosing between them
                   before either could be pressed. -->
              <div class="fp-way">
                <!-- One word over both rows: each press says which of the two
                     it is, and a heading repeating it said the same thing
                     twice down a narrow column. -->
                <div class="side-sub">Automatic</div>
                <!-- Every drawn thing measured in its own right: so many
                     points inside each tileset, however many tilesets there
                     are. -->
                <div class="fp-lay">
                  <input type="number" id="fp-count" min="1" max="99" step="1"
                         aria-label="how many focus points in each tileset"
                         title="How many focus points to lay in each tileset">
                  <button type="button" class="sf-flat sf-doing" id="fp-place">Place per tileset</button>
                </div>
                <!-- One set over everything there is, which is the answer for a
                     sample that sits flat: the height across a slide is one
                     surface, and measuring it once beats measuring it again in
                     every tileset standing on it. -->
                <div class="fp-lay">
                  <input type="number" id="fp-count-all" min="1" max="99" step="1"
                         aria-label="how many focus points over the whole carrier"
                         title="How many focus points to lay over the whole carrier">
                  <button type="button" class="sf-flat sf-doing" id="fp-place-all">Place per carrier</button>
                </div>
              </div>
            </div>

            <!-- The press that measures what was laid, at the end of the box
                 that laid it, and beside it the way back out: both act on every
                 point there is, where the row above acts on one tileset at a
                 time. -->
            <div class="fp-run">
              <div class="focus-action"></div>
            </div>

            <!-- What can be done to a map that has already been run, and not
                 there before one has: every press here is about a map that
                 exists, and three greyed buttons under the press that makes one
                 say nothing the greyed press has not already said.

                 Rerun and Refine differ only in where each search begins — at
                 the height the objective is standing at now, or at what the map
                 already predicts for that point — which is the whole of what an
                 operator is choosing between. -->
            <div class="fp-again" id="fp-again" hidden>
              <button type="button" class="sf-flat sf-doing" id="fp-rerun"
                      title="Measure every point again, each search starting from the height the objective is at now">
                Rerun
              </button>
              <button type="button" class="sf-flat sf-doing" id="fp-refine"
                      title="Measure every point again, each search starting from the height this map predicts there">
                Refine
              </button>
              <button type="button" class="sf-flat" id="fp-reset"
                      title="Throw the map away, and the points it was measured from with it">
                Reset
              </button>
            </div>
          </div>
        </div>

        <!-- Not there until the map has been run: a trace is what a sweep
             came back with, and before the run there is nothing to look at.

             One box, three parts, each under a quiet word for it: the points
             that were measured, the image at the height that was chosen, and
             the sweep that chose it. -->
        <div class="side-group" id="focus-traces" hidden>
          <div class="side-group-title">Inspect focus traces</div>
          <div class="side-group-body">
            <div class="side-sub">Focus points</div>
            <!-- Three rows deep, and scrolled past that: the list is here to
                 choose from, and a list as long as the map pushes the picture
                 it belongs to off the screen. -->
            <div class="point-list" id="point-list"></div>

            <div class="side-sub">Focus plot</div>
            <!-- its own host: the canvas is sized from its parent's box -->
            <div class="trace-host">
              <div class="trace-plot">
                <canvas id="trace-canvas"></canvas>
              </div>
              <div class="trace-empty" id="trace-empty">Run the strategy to measure each point, then its sweep appears here.</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
  <script type="module" src="/framework/window/main.js"></script>
</body>
</html>
