# The base environment of the target acquisition workflow for coders: Python
# and Jupyter, from conda-forge only. The ZMART parts are added one by one,
# each at a released version (see README.md).
name: zmart-for-coders
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - git
  - jupyterlab
