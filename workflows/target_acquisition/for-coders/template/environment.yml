# The base environment of the target acquisition workflow for coders: Python
# and Jupyter, from conda-forge only. The ZMART parts are added one by one,
# each at a released version (see ../README.md).
name: zmart-for-coders
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - git
  - jupyterlab
  - matplotlib   # the notebook shows each image as it is taken
  - tifffile
  - ome-types    # the OME description inside an OME-TIFF, which the analysis steps read
