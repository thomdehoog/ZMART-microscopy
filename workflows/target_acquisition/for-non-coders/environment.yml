# The base environment of the target acquisition workflow for non-coders: Python
# and the ZMART Controller, from conda-forge only. setup_zmart.py makes it and
# adds the driver and the other blocks (README.md).
name: zmart-for-non-coders
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - git
  - pip:
      - zmart-controller @ git+https://github.com/ZMB-UZH/ZMART-controller@v0.4.0rc9
