# The base environment of the target acquisition workflow for non-coders: Python
# and the ZMART Controller, from conda-forge only. The driver is added by hand
# (README.md, step 1); install.py adds the ZMART Interface (step 3).
name: zmart-for-non-coders
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - git
  - pip:
      - zmart-controller @ git+https://github.com/ZMB-UZH/ZMART-controller@v0.4.0rc7
