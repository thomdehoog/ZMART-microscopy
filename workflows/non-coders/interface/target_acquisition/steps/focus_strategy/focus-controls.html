<!-- The focus step's controls: "Add focus points" and, once a map has been
     measured, "Inspect focussing results".

     Focus strategy has no panel of its own: it happens on the canvas, and
     these are its controls. The focus map (focus-map.js) puts this markup
     into the page when it loads, hidden, and the step's channel moves it
     into the column beside the canvas while that step is standing, so
     everything in it is built and wired once. It lives here, in the step's
     own folder, rather than in the page's template, because the template is
     the framework's and knows no step. -->
<div id="focus-controls" hidden>
  <div class="side-group">
    <div class="side-group-title">Add focus points</div>
    <div class="side-group-body fp-box">
      <!-- The same two ways the step before offers, under the same
           words -- one at a time by hand, or so many to a tileset all
           at once -- and what is then done with the points, under a
           third. Every row of controls starts at the box's edge. -->
      <div class="side-sub">Manual</div>
      <div class="fp-tools">
        <div>
        <button type="button" class="sf-tool" id="fp-select"
                title="Select — press a point to choose it, drag to move it">
          <span class="sf-glyph">↖</span>
        </button>
        <button type="button" class="sf-tool" id="fp-pick"
                title="Place focus points — press the map to put one down, press one to take it away">
          <!-- The mark it puts down, drawn at the size a glyph is: the
               button and the thing it makes say the same thing. Its
               proportions are the canvas reticle's — a circle of 4.5
               with arms from 6.5 to 11, at a scale of one to two. -->
          <svg class="sf-glyph sf-glyph-drawn" viewBox="0 0 22 22" aria-hidden="true">
            <circle cx="11" cy="11" r="2.25" />
            <path d="M 5.5 11 L 7.75 11 M 14.25 11 L 16.5 11
                     M 11 5.5 L 11 7.75 M 11 14.25 L 11 16.5" />
          </svg>
        </button>
        </div>
      </div>

      <div class="side-sub">Automatic</div>
      <div class="fp-row">
        <!-- Every drawn thing measured in its own right: so many
             points inside each tileset, however many tilesets there
             are. -->
        <div class="fp-lay">
          <input type="number" id="fp-count" min="1" max="99" step="1"
                 aria-label="how many focus points in each tileset"
                 title="How many focus points to lay in each tileset">
          <button type="button" class="sf-flat sf-doing" id="fp-place">Per tileset</button>
        </div>
        <!-- One set over everything there is, which is the answer for a
             sample that sits flat: the height across a slide is one
             surface, and measuring it once beats measuring it again in
             every tileset standing on it. -->
        <div class="fp-lay">
          <input type="number" id="fp-count-all" min="1" max="99" step="1"
                 aria-label="how many focus points over the whole carrier"
                 title="How many focus points to lay over the whole carrier">
          <button type="button" class="sf-flat sf-doing" id="fp-place-all">Per carrier</button>
        </div>
        <!-- Throwing the points away stands beside the ways of
             laying them: it is about the points, not about the map. -->
        <button type="button" class="sf-flat" id="fp-clear"
                title="Throw away the points, and the map measured from them with it">
          Clear all
        </button>
      </div>

      <!-- What is done with the points. The step's own press makes the
           map; Rerun stands in its place once there is one to measure
           again, and the two beside it act on that map. -->
      <div class="side-sub">Apply</div>
      <div class="fp-row" id="fp-again">
        <div class="focus-action"></div>
        <button type="button" class="sf-flat sf-doing" id="fp-rerun"
                title="Measure every point again, each search starting from the height the objective is at now">
          Rerun
        </button>
        <button type="button" class="sf-flat sf-doing" id="fp-runnew"
                title="Measure only the points that have no reading yet — placed since the last run, or moved since they were read">
          Run new points
        </button>
      </div>
    </div>
  </div>

  <!-- Not there until the map has been run: a trace is what a sweep
       came back with, and before the run there is nothing to look at.

       One box, three parts, each under a quiet word for it: the points
       that were measured, the image at the height that was chosen, and
       the sweep that chose it. -->
  <div class="side-group" id="focus-traces" hidden>
    <div class="side-group-title">Inspect focussing results</div>
    <div class="side-group-body">
      <!-- and, at the end of the same line, how many of them are worth
           a second look: a list four rows deep scrolls, so the count is
           what says there is something to scroll to. -->
      <div class="side-sub">Focus points<span class="tallies"><span
           class="warn-count" id="fp-warned"></span></span></div>
      <!-- Three rows deep, and scrolled past that: the list is here to
           choose from, and a list as long as the map pushes the picture
           it belongs to off the screen. -->
      <div class="point-list" id="point-list"></div>

      <!-- its own host: the canvas is sized from its parent's box -->
      <div class="trace-host">
        <!-- the slice of the stack at the height the black line stands
             on: the real captured plane, served by the backend, so the
             operator chooses focus by looking rather than by trusting
             the curve. Hidden while the backend names no slices. -->
        <div class="zpreview" id="zpreview" hidden>
          <!-- each picture named with its plane: the slice is the
               sample's own (xy); the side view is the cut along the
               red line, x across and heights down (zx). -->
          <div class="side-sub">Focus stack (xy)</div>
          <div class="side-sub zcut-title">Reslice</div>
          <div class="side-sub zx-title">Focus stack (zx)</div>
          <div class="zframe">
            <canvas id="zpreview-canvas" width="176" height="176"></canvas>
          </div>
          <!-- the slider between the pictures is the cut: its thumb is
               the height on the left picture that the right one unrolls
               through the stack. -->
          <input type="range" class="zcut" id="zcut-slider"
                 min="0" max="1000" value="500"
                 aria-label="where on the picture the zx view cuts">
          <div class="zortho">
            <canvas id="zortho-canvas" width="352" height="352"></canvas>
          </div>
        </div>
        <div class="side-sub">Focus plot</div>
        <div class="trace-plot">
          <canvas id="trace-canvas"></canvas>
        </div>
        <div class="trace-empty" id="trace-empty">Run the strategy to measure each point, then its sweep appears here.</div>
      </div>

      <!-- What can be done to the one point being read. Rerun measures
           it again; Reset puts it back to the height the instrument
           chose, and Reset all does that for every point on the map.
           There is no Accept: a height the operator drags simply
           stands, because moving it is the look. -->
      <div class="ft-acts">
        <button type="button" class="sf-flat sf-doing" id="ft-rerun"
                title="Measure this one point again, starting from the height the objective is at now">
          Rerun
        </button>
        <button type="button" class="sf-flat" id="ft-reset"
                title="Put this point back to the height the autofocus chose">
          Reset current
        </button>
        <button type="button" class="sf-flat" id="ft-reset-all"
                title="Put every point back to the height the autofocus chose">
          Reset all
        </button>
      </div>
    </div>
  </div>
</div>
