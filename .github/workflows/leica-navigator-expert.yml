# Leica Navigator Expert driver CI.
#
# This file is intentionally thin. GitHub only runs workflows from
# .github/workflows/, so it cannot live inside the driver folder. What runs,
# the markers, the coverage and the reports are all defined in the driver's
# own run_ci.py and pytest.ini; this workflow only starts run_ci.py.
#
# The driver's adapter plugs into the ZMART Controller, so the controller is
# installed first. Until the controller has its own repository, it comes from
# its release candidate branch of ZMART-microscopy. The controller needs
# Python 3.12 or newer, which is why only 3.12 is tested here.
name: leica-navigator-expert

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  offline:
    name: offline (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg # headless matplotlib for the calibration plot tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the env header records the real git rev

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the ZMART Controller and the test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "zmart-controller @ git+https://github.com/thomdehoog/ZMART-microscopy@release-candidate-zmart-controller"
          python -m pip install -r zmart_drivers/leica/stellaris5_y42h93/navigator_expert/requirements-dev.txt

      - name: Run driver CI (offline suite + coverage)
        run: python zmart_drivers/leica/stellaris5_y42h93/navigator_expert/run_ci.py

      - name: Upload reports
        if: always() # keep reports even when tests fail -- that's when they matter most
        uses: actions/upload-artifact@v4
        with:
          name: leica-navigator-expert-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          path: zmart_drivers/leica/stellaris5_y42h93/navigator_expert/tests/_report/
          if-no-files-found: warn
