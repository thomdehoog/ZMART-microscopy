# Object feature extraction from a saved detection checkpoint.

metadata:
  purpose: "Object features from saved detection masks"
  version: "1.0"
  verbose: 1
  functions_dir: "../steps"

object_features:
  - load_detected_objects:

  - extract_classical_features:

  - extract_deep_features:
      backend: "dinov2"
      model_name: "dinov2_vitb14"
      model_cache_dir: "Z:/zmbstaff/10374/Protocols_Notes/DINO_models"
      input_size_px: 224
      input_intensity_scale: null
      batch_size: 8
      crop_size_px: 128
      mask: true
      align_orientation: false
      min_eccentricity_to_align: 0.4
      drop_incomplete_crops: true

  - build_object_table:
