# Object detection checkpoint for one acquired image tile.

metadata:
  purpose: "Object detection checkpoint"
  version: "1.0"
  verbose: 1
  functions_dir: "../steps"

object_detection:
  - detect_objects:
      method: accurate   # accurate = Cellpose; fast = QuPath-style watershed
      threshold: 100     # fast only: a nucleus's mean above background, in counts
      channels: null
      channel_axis: null
      cellprob_threshold: 0.0
      flow_threshold: 0.4
      niter: null
      diameter: null
      segmentation_binning: 1
      border_margin_px: null
      min_area_px: null
      max_area_px: null
      min_equivalent_diameter_um: null
      max_equivalent_diameter_um: null
      gpu: true
      persist_only: true
