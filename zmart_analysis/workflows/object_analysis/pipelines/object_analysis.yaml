# Object-centered analysis for one acquired image tile.

metadata:
  purpose: "Object-centered image analysis"
  version: "1.0"
  verbose: 1
  functions_dir: "../steps"

object_analysis:
  - detect_objects:
      channels: null
      channel_axis: null
      cellprob_threshold: 0.0
      flow_threshold: 0.4
      niter: null
      diameter: null
      segmentation_binning: 1
      border_margin_px: null
      min_area_px: null
      max_area_px: null
      min_equivalent_diameter_um: null
      max_equivalent_diameter_um: null
      gpu: true

  - extract_classical_features:
      # Every extras family: texture (gradients, stat_texture, lbp, fft,
      # glrlm), background (global_bg, local_bg), neighbourhood, morphology.
      # Each becomes a gating axis on the page, and every channelised extra
      # is reported per colour (name, name_c0, name_c1, ...), the same
      # contract the intensity columns already follow.
      extras: [all]

  - build_object_table:
