# Nikon NIS-Elements driver -- pytest configuration.
#
# `pytest` from this folder runs the offline suite: the real bridge server
# with a fake NIS API behind it, so no NIS-Elements and no hardware. Tests
# marked `hardware` need NIS-Elements (simulator is fine) with the bridge
# started; select them with `-m hardware`.
[pytest]
testpaths = tests

addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not hardware"

markers =
    hardware: needs a running NIS-Elements with start_bridge.mac executed (simulator or real).
