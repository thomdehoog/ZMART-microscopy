[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nis-useq"
version = "0.1.0"
description = "Run useq-schema acquisitions on a Nikon microscope through NIS-Elements"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
requires-python = ">=3.10"
dependencies = ["numpy", "tifffile", "useq-schema>=0.9.2"]

[project.optional-dependencies]
pymmcore = ["pymmcore-plus>=0.18"]
test = ["pytest", "pymmcore-plus>=0.18"]

[tool.setuptools]
packages = ["nis_useq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not hardware'"
markers = [
    "hardware: needs NIS-Elements (the simulator is fine) with start_bridge.mac running",
]
