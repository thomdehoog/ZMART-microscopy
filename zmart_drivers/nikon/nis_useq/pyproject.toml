[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nis-useq"
version = "0.1.0"
description = "Run useq-schema acquisitions on a Nikon microscope through NIS-Elements"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
requires-python = ">=3.10"
dependencies = ["numpy", "tifffile", "useq-schema>=0.9.2"]

[project.optional-dependencies]
pymmcore = ["pymmcore-plus>=0.18"]
assistant = ["pymmcore-plus>=0.18", "pydantic-ai-slim[anthropic]>=2.50", "PySide6>=6.7", "pillow"]
test = ["nis-useq[assistant]", "pytest", "pytest-qt"]

[project.scripts]
nis-useq-assistant = "nis_useq.window:main"

[tool.setuptools]
packages = ["nis_useq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not hardware'"
markers = [
    "hardware: needs NIS-Elements (the simulator is fine) with start_bridge.mac running",
]
qt_api = "pyside6"
