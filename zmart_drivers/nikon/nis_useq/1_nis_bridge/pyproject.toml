[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nis-bridge"
version = "0.1.0"
description = "Control NIS-Elements from your own Python through a small bridge inside NIS"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
requires-python = ">=3.10"
dependencies = ["numpy", "tifffile"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["nis_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not hardware'"
markers = ["hardware: needs NIS-Elements (the simulator is fine) with start_bridge.mac running"]
