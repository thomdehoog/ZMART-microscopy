[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nis-bridge"
version = "0.1.0"
description = "Control NIS-Elements from your own Python through a small bridge inside NIS"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
requires-python = ">=3.10"
dependencies = ["numpy", "tifffile"]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[tool.setuptools]
packages = ["nis_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not hardware'"
markers = ["hardware: needs NIS-Elements (the simulator is fine) with start_bridge.mac running"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",  # errors, pyflakes, warnings
    "I",            # import order
    "UP",           # syntax that is out of date for Python 3.10
    "B",            # likely bugs
    "SIM", "C4", "PIE", "RET", "PERF",  # needless complexity
    "RUF",          # ruff's own checks
    "PT",           # pytest style
]
ignore = ["PT018"]  # one assert may check two related things
