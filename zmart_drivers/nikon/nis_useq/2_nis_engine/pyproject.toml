[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nis-engine"
version = "0.1.0"
description = "Run useq-schema acquisitions on a Nikon microscope through NIS-Elements"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
requires-python = ">=3.10"
# nis-bridge is part 1, next to this folder: install it first (see README).
dependencies = ["nis-bridge", "numpy", "tifffile", "useq-schema>=0.9.2", "pymmcore-plus>=0.18"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["nis_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not hardware'"
markers = ["hardware: needs NIS-Elements (the simulator is fine) with start_bridge.mac running"]
