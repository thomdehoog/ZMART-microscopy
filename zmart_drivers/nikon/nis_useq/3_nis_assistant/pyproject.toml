[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nis-assistant"
version = "0.1.0"
description = "A chat assistant that runs a Nikon microscope through useq, and explains it"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
requires-python = ">=3.10"
# nis-engine is part 2, next to this folder: install parts 1 and 2 first (see README).
# pyyaml: useq reads .yaml sequence files with it.
dependencies = ["nis-engine", "pydantic-ai-slim[anthropic]>=2.50", "PySide6>=6.7", "pillow", "pyyaml"]

[project.optional-dependencies]
google = ["pydantic-ai-slim[google]>=2.50"]
test = ["pytest", "pytest-qt", "ruff"]

[project.scripts]
nis-assistant = "nis_assistant.window:main"

[tool.setuptools]
packages = ["nis_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not hardware'"
markers = ["hardware: needs NIS-Elements (the simulator is fine) with start_bridge.mac running"]
qt_api = "pyside6"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",  # errors, pyflakes, warnings
    "I",            # import order
    "UP",           # syntax that is out of date for Python 3.10
    "B",            # likely bugs
    "SIM", "C4", "PIE", "RET", "PERF",  # needless complexity
    "RUF",          # ruff's own checks
    "PT",           # pytest style
]
ignore = ["PT018"]  # one assert may check two related things
