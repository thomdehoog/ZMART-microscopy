[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zmart-controller"
version = "0.1.0"
description = "One small, consistent way to drive any microscope from Python."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
# The controller only forwards calls to a driver, so it needs nothing beyond
# the Python standard library.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Acquisition",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = [
    "zmart_controller",
    "zmart_driver_mock",
    "zmart_driver_mock.zmart_controller",
    "zmart_driver_mock.vendor_interface",
    "zmart_driver_mock.error_handling",
    "zmart_driver_mock.get_commands",
    "zmart_driver_mock.set_commands",
    "zmart_driver_mock.procedures",
    "zmart_driver_mock.data_handling",
    "zmart_driver_mock.configuration",
    "zmart_driver_mock.testing",
    "zmart_driver_mock.testing.mock_api",
]

[tool.setuptools.package-data]
"zmart_driver_mock.zmart_controller" = ["zmart.json"]
"zmart_driver_mock.configuration" = ["defaults/*.json"]
"zmart_driver_mock.testing.mock_api" = ["README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
