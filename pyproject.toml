[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zmart-viewer"
version = "0.1.0"
description = "A viewer for large, changing, multi-channel microscopy images, and the writer that feeds it while a run is going."
readme = "README.md"
# No upper bound: the canonical environment (environment.yml, env zmart-viz) runs
# Python 3.14, and the whole suite passes there. The old `<3.13` cap predates that
# env and refused the very interpreter the project is developed on.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

# The runtime dependencies are not repeated here: they are read from
# requirements.txt, which is the pip mirror of the canonical conda environment in
# environment.yml. Writing the same list down twice is how two copies of it drift
# apart, and a dependency present in one and missing from the other is exactly the
# fault that only shows up on somebody else's machine.
dynamic = ["dependencies"]

# The tools for running the tests, which cannot be read from requirements-dev.txt
# the same way because that file begins by including requirements.txt, and the
# reader above understands only plain requirements. They are listed here rather
# than left out because a fresh checkout should be able to ask for everything it
# needs to run the suite in one command.
[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "playwright>=1.58,<2",
    "pillow>=10",
    "ngff-zarr[validate]>=0.41",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
# Named rather than discovered, because this repository holds more than library
# code: measurement scripts and the viewer's own front end live here too, and
# neither belongs in an install.
#
# One honest omission. The viewer's server (`viz_studio/backend`) is a set of
# loose modules that its scripts and tests reach by adding the folder to the
# import path, rather than a package you can import after installing. Installing
# therefore gives you the writer and the run control, and the viewer is still
# started from inside its own folder -- see viz_studio/README.md. Turning it into
# a package is worth doing and is not a small change, because a dozen scripts and
# the whole browser test suite import those modules by bare name.
packages = ["zmart_storage", "zmart_live"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "build",
    "dist",
    ".venv",
    ".eggs",
    "**/__pycache__",
    # The built viewer page and its dependencies are generated, not written.
    "viz_studio/frontend/dist",
    "viz_studio/frontend/node_modules",
]

[tool.ruff.lint]
# Conservative starter set. Add rule families incrementally as the
# baseline shrinks. ruff check is report-only by default; pass --fix
# explicitly to apply autofixes.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names, ...)
    "W",   # pycodestyle warnings
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (dead syntax for the target Python)
    "B",   # flake8-bugbear (likely bugs)
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    "B008",  # function-call-in-default-argument: false-positive heavy
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
